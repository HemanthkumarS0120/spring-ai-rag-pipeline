spring.application.name=Spring-AI-SimpleProject



spring.ai.anthropic.api-key=${HAI_API_KEY}
spring.ai.anthropic.base-url=http://localhost:6655/anthropic
spring.ai.anthropic.chat.options.model=claude-sonnet-latest


#for Ollama model loacl
#spring.ai.model.chat=ollama
#spring.ai.ollama.chat.model=llama3.2:latest


#For multi-chat models, telling the framework to not create a chat client beans, will take care of that manually
#spring.ai.chat.client.enabled=false

#spring.ai.bedrock.aws.region=us-east-1
#spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY}
#spring.ai.bedrock.aws.secret-key=${AWS_SECRET_KEY}
#spring.ai.model.chat=bedrock-converse
#spring.ai.bedrock.converse.chat.model=${BEDROCK_MODEL_ARN}


logging.level.org.springframework.ai.chat.client.advisor=DEBUG


#H2 database properties to save the chat memory data
spring.datasource.url=jdbc:h2:file:~/chatmemory;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=Hemanth
spring.datasource.password=12345
# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update


spring.ai.chat.memory.repository.jdbc.initialize-schema=always




# OpenAI - for embeddings only
#spring.ai.openai.api-key=your-openai-api-key
#spring.ai.openai.embedding.model=text-embedding-3-small

# Use Ollama for embeddings
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.model.embedding=ollama

# Tell Spring AI - use Anthropic for chat, OpenAI for embeddings
spring.ai.model.chat=anthropic

# Qdrant Cloud config
spring.ai.vectorstore.qdrant.host=5735d89a-c197-42c0-9b2d-62f149dc4239.us-west-2-0.aws.cloud.qdrant.io
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.collection-name=my-documents
spring.ai.vectorstore.qdrant.use-tls=true
spring.ai.vectorstore.qdrant.check-compatibility=false

spring.ai.vectorstore.qdrant.initialize-schema=true



#Audit property for Chatclientbuilder customizer
audit.token-usage.enabled=true


#actuator property
management.endpoints.web.exposure.include=health,metrics,prometheus,beans,env,conditions

#jaegar setup property
# Tracing → Jaeger (works)
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

management.tracing.sampling.probability=1.0

# Disable OTLP metrics export (Jaeger doesn't support this)
management.otlp.metrics.export.enabled=false

